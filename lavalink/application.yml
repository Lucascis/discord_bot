server:
  port: 2333
  address: 0.0.0.0
  # Performance optimization
  compression:
    enabled: true
    level: 6

lavalink:
  server:
    password: ${LAVALINK_PASSWORD:c0mm3rc1al_lav4l1nk_s3cur3_2025}
    # Disable built-in YouTube source to use plugin
    sources:
      youtube: false
      soundcloud: true
      http: true
      local: false
      bandcamp: true
      vimeo: true
    filters:
      volume: true
      equalizer: true
      karaoke: true
      timescale: true
      tremolo: true
      vibrato: true
      rotation: true
      distortion: true
      channelMix: true
      lowPass: true
    # Enhanced performance settings for production - tuned for stable playback (Fase 1 stability)
    bufferDurationMs: 2200          # Larger jitter buffer to reduce microcortes
    frameBufferDurationMs: 18000   # Larger frame cache for sustained 24/7 playback
    nonAllocatingFrameBuffer: true # Reduce allocations and GC pressure under load
    opusEncodingQuality: 8
    resamplingQuality: HIGH
    trackStuckThresholdMs: 20000   # More tolerant to transient stalls (was 15000)
    useSeekGhosting: true
    playerUpdateInterval: 5         # Keep player updates frequent enough for stable position/progress
    youtubePlaylistLoadLimit: 50  # Reduced to save memory
    soundcloudSearchEnabled: true
    gc-warnings: true

    # Memory and CPU optimizations
    playerEventListenerBufferTimeout: 5000
    httpTimeout: 10000
    # Connection pool settings - optimized for search performance
    httpPoolSize: 32  # Doubled for better concurrent search handling
    httpMaxPendingRequests: 128  # Doubled to handle more concurrent searches

# Plugin-specific configuration
plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    # Hardened client order:
    # - Prefer clients that are typically less brittle for playback.
    # - Keep WEB/WEBEMBEDDED available for metadata/search and PoToken compatibility.
    clients:
      - ANDROID_VR
      - WEB
      - WEBEMBEDDED
    clientOptions:
      ANDROID_VR:
        playback: true
        videoLoading: true
        playlistLoading: true
        searching: true
      WEB:
        playback: false
        videoLoading: false
        playlistLoading: true
        searching: true
      WEBEMBEDDED:
        playback: false
        videoLoading: false
        playlistLoading: true
        searching: true
    # Additional performance settings - optimized for search speed
    playlistLoadLimit: 50  # Reduced to prioritize search speed over large playlist loading
    videoLoadLimit: 25     # Reduced for faster individual video loading
    maxRetryAttempts: 3    # More tolerant to transient YouTube extraction failures
    retryDelayMs: 1000
    # Enhanced token management for better reliability
    oauth:
      enabled: false
      refreshToken: ${YOUTUBE_REFRESH_TOKEN:}
    # Proof of Origin Token for enhanced compatibility (v1.15.0 format)
    pot:
      token: ${YOUTUBE_PO_TOKEN:}
      visitorData: ${YOUTUBE_VISITOR_DATA:}
  lavasrc:
    # Enhanced providers with YouTube Music prioritization
    providers:
      - "ytsearch:\"%ISRC%\""
      - "ytsearch:%QUERY%"

    # Enable multiple music sources for better track availability
    sources:
      spotify: true
      deezer: false
      applemusic: false
      youtube: true
      jiosaavn: false
      yandexmusic: false

    # Music platform configurations
    spotify:
      clientId: ${SPOTIFY_CLIENT_ID:}
      clientSecret: ${SPOTIFY_CLIENT_SECRET:}
      countryCode: "US"
      resolveArtistsInSearch: true
      playlistLoadLimit: 100
      albumLoadLimit: 100
    
    # YouTube Music specific configuration
    youtube:
      countryCode: "US"
    
  
  lavasearch:
    sources:
      youtube: true
      spotify: true
      deezer: false

  sponsorblock:
    enabled: false
    categories:
      - sponsor
      - selfpromo
      - interaction
      - intro
      - outro
      - preview
      - music_offtopic
      - filler

  lavalyrics:
    sources:
      spotify: true
      deezer: true
      youtube: true
      genius: true
      musixmatch: true
      lrclib: true
      tekstowo: true
      azlyrics: true

logging:
  level:
    root: INFO
    lavalink: INFO
