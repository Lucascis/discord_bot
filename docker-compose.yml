services:
  # Database service
  postgres:
    image: postgres:15.8-alpine3.20
    container_name: discord-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: discord
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d discord"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - discord-network
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          memory: 1G

  # Redis cache service
  redis:
    image: redis:7.4.1-alpine3.20
    container_name: discord-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - discord-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          memory: 256M

  # Lavalink audio server
  lavalink:
    build:
      context: ./lavalink
      dockerfile: Dockerfile
    container_name: discord-lavalink
    env_file: .env
    environment:
      # Lavalink official env-based configuration:
      # https://lavalink.dev/configuration/config/environment-variables
      SERVER_PORT: "2333"
      SERVER_ADDRESS: "0.0.0.0"
      LAVALINK_SERVER_PASSWORD: "${LAVALINK_PASSWORD}"
      LAVALINK_SERVER_SOURCES_YOUTUBE: "false"
      LAVALINK_SERVER_SOURCES_BANDCAMP: "true"
      LAVALINK_SERVER_SOURCES_SOUNDCLOUD: "true"
      LAVALINK_SERVER_SOURCES_TWITCH: "true"
      LAVALINK_SERVER_SOURCES_VIMEO: "true"
      LAVALINK_SERVER_SOURCES_HTTP: "true"
      LAVALINK_SERVER_SOURCES_LOCAL: "false"
      LAVALINK_PLUGINS_0_DEPENDENCY: "dev.lavalink.youtube:youtube-plugin:1.17.0"
      LAVALINK_PLUGINS_0_SNAPSHOT: "false"
      _JAVA_OPTIONS: "-Xms1G -Xmx1536M -XX:+UseG1GC -XX:MaxGCPauseMillis=80 -XX:InitiatingHeapOccupancyPercent=30 -XX:G1ReservePercent=20"
    ports:
      - "2333:2333"
    volumes:
      - lavalink_logs:/opt/Lavalink/logs
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider --header='Authorization: ${LAVALINK_PASSWORD}' http://localhost:2333/v4/stats || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    networks:
      - discord-network
    deploy:
      resources:
        limits:
          cpus: '3'
          memory: 2G
        reservations:
          memory: 1.5G

  # Discord Gateway Service
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: discord-gateway
    command: node gateway/dist/index.js
    env_file: .env
    environment:
      # Increased heap for large shards (1000+ guilds) while keeping a cap
      NODE_OPTIONS: "--expose-gc --max-old-space-size=768"
      DATABASE_URL: "postgresql://postgres:postgres@discord-postgres:5432/discord"
      REDIS_URL: "redis://discord-redis:6379"
      LAVALINK_HOST: "discord-lavalink"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      lavalink:
        condition: service_healthy
    ports:
      - "3001:3001"
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3001/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    networks:
      - discord-network
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 512M

  # REST API Service
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: discord-api
    command: node api/dist/index.js
    env_file: .env
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@discord-postgres:5432/discord"
      REDIS_URL: "redis://discord-redis:6379"
      LAVALINK_HOST: "discord-lavalink"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3000:3000"
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    networks:
      - discord-network
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # Audio Processing Service
  audio:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: discord-audio
    command: node audio/dist/index.js
    env_file: .env
    environment:
      NODE_OPTIONS: "--expose-gc --max-old-space-size=768"
      DATABASE_URL: "postgresql://postgres:postgres@discord-postgres:5432/discord"
      REDIS_URL: "redis://discord-redis:6379"
      LAVALINK_HOST: "discord-lavalink"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      lavalink:
        condition: service_healthy
    ports:
      - "3002:3002"
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3002/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    networks:
      - discord-network
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  # Background Worker Service
  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: discord-worker
    command: node worker/dist/index.js
    env_file: .env
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@discord-postgres:5432/discord"
      REDIS_URL: "redis://discord-redis:6379"
      LAVALINK_HOST: "discord-lavalink"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3003:3003"
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3003/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    networks:
      - discord-network
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # Panel Web (Next.js)
  panel:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: discord-panel
    command: pnpm --filter @discord-bot/panel start
    env_file: .env
    environment:
      PORT: 3000
      NODE_ENV: production
      NEXTAUTH_URL: "http://localhost:3004"
      NEXT_PUBLIC_API_BASE_URL: "http://localhost:3000"
      INTERNAL_API_BASE_URL: "http://api:3000"
      AUTH_TRUST_HOST: "true"
      DATABASE_URL: "postgresql://postgres:postgres@discord-postgres:5432/discord"
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3004:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    networks:
      - discord-network

# Named volumes for data persistence
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  lavalink_logs:
    driver: local

# Custom network for service isolation
networks:
  discord-network:
    driver: bridge
