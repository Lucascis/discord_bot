services:
  # Test PostgreSQL Database
  postgres-test:
    image: postgres:16-alpine
    container_name: discord-bot-postgres-test
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: discord_bot_test
    ports:
      - "5433:5432"
    networks:
      - test-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Test Redis Cache
  redis-test:
    image: redis:7-alpine
    container_name: discord-bot-redis-test
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    ports:
      - "6380:6379"
    networks:
      - test-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Test Lavalink node for audio e2e
  lavalink-test:
    image: ghcr.io/lavalink-devs/lavalink:4
    container_name: discord-bot-lavalink-test
    profiles: ["audio-e2e", "infra"]
    environment:
      SERVER_PORT: "2333"
      SERVER_ADDRESS: "0.0.0.0"
      LAVALINK_SERVER_PASSWORD: "${LAVALINK_PASSWORD:-youshallnotpass}"
      LAVALINK_SERVER_SOURCES_YOUTUBE: "false"
      LAVALINK_SERVER_SOURCES_BANDCAMP: "true"
      LAVALINK_SERVER_SOURCES_SOUNDCLOUD: "true"
      LAVALINK_SERVER_SOURCES_TWITCH: "true"
      LAVALINK_SERVER_SOURCES_VIMEO: "true"
      LAVALINK_SERVER_SOURCES_HTTP: "true"
      LAVALINK_SERVER_SOURCES_LOCAL: "false"
      LAVALINK_PLUGINS_0_DEPENDENCY: "dev.lavalink.youtube:youtube-plugin:1.17.0"
      LAVALINK_PLUGINS_0_REPOSITORY: "https://maven.lavalink.dev/releases"
      _JAVA_OPTIONS: "-Xms512M -Xmx1024M -XX:+UseG1GC -XX:MaxGCPauseMillis=200"
    ports:
      - "2334:2333"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider --header='Authorization: ${LAVALINK_PASSWORD:-youshallnotpass}' http://localhost:2333/v4/stats || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - test-network

networks:
  test-network:
    driver: bridge
